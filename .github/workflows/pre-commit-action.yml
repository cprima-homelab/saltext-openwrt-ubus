---
name: Pre-Commit

on:
  workflow_call:
    inputs:
      changed-files:
        required: true
        type: string
        description: JSON string containing information about changed files

jobs:
  Pre-Commit:
    name: Pre-Commit
    runs-on: ubuntu-24.04
    container:
      image: 'docker.io/library/python:3.10.19-slim-bookworm@sha256:eae406f018dd9c05687bdd6c13fe47443945c78e7c3320d57a5b3dfecc5d08b2'

    strategy:
      fail-fast: false
      matrix:
        package: [uci, uci-ubus, uci-ssh]

    defaults:
      run:
        working-directory: packages/${{ matrix.package }}

    steps:
      - name: Install System Deps
        run: |
          apt-get update
          apt-get install -y enchant-2 git gcc make zlib1g-dev libc-dev libffi-dev g++ libxml2 libxml2-dev libxslt-dev libcurl4-openssl-dev libssl-dev libgnutls28-dev
          git config --global --add safe.directory "$(pwd)"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Pre-Commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          pre-commit install --install-hooks

      # Each package has its own .pre-commit-config.yaml; run all files for
      # its own tree rather than trying to split a repo-wide changed-files
      # list by package. Simpler and correct, at the cost of always doing a
      # full run instead of an incremental one on PRs.
      - name: Check ALL Files
        run: |
          pre-commit run --show-diff-on-failure --color=always --all-files

      - name: Set Exit Status
        if: always()
        run: |
          mkdir exitstatus
          echo "${{ job.status }}" > exitstatus/${{ github.job }}-${{ matrix.package }}

      - name: Upload Exit Status
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: exitstatus-${{ github.job }}-${{ matrix.package }}
          path: packages/${{ matrix.package }}/exitstatus
          if-no-files-found: error
