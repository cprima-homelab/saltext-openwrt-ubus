name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install build --user
      - name: Build wheel and sdist
        run: |
          # uv build resolves this repo's uv.lock build-constraint
          # (setuptools<69, needed only for building salt's legacy setup.py),
          # which forces the old standalone `wheel` package's bdist_wheel —
          # its filename normalization doesn't handle dotted project names
          # correctly. python -m build with a looser constraint (matching
          # package-action.yml's setuptools<77) resolves modern setuptools
          # (>=70.1) with the integrated, correctly-normalizing bdist_wheel.
          echo "setuptools<77" > "$RUNNER_TEMP/build-constraints.txt"
          PIP_CONSTRAINT="$RUNNER_TEMP/build-constraints.txt" python -m build --outdir dist/
        env:
          # v0.1.0 as a git tag is already taken by an unrelated pre-rename
          # commit in this repo's history; override the setuptools_scm-derived
          # version so the first saltext.uci-ubus release is still 0.1.0 on
          # PyPI without touching that existing tag.
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.1.0"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for OIDC trusted publishing — no PyPI token secret needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
