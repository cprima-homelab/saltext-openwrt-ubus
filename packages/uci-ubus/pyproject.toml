[build-system]
requires = [
    "wheel>=0.44",
    "setuptools>=50.3.2",
    "setuptools_scm[toml]>=3.4",
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
root = "../.."
write_to = "src/saltext/uci_ubus/version.py"
write_to_template = "__version__ = \"{version}\"\n"
tag_regex = '^uci-ubus-v(?P<version>.*)$'
# All 3 packages' tags can point at the same commit -- tag_regex only
# parses whatever tag `git describe` already picked, it doesn't select
# among co-located tags. --match constrains git describe itself.
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "uci-ubus-v*"]

[project]
name = "saltext.uci-ubus"
description = "Salt extension for OpenWrt configuration management via ubus"
authors = [
    {name = "Christian Prior-Mamulyan", email = "cprior@gmail.com"},
]
keywords = [
    "salt-extension",
]
license = {text = "Apache Software License"}
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
]
requires-python = ">= 3.10"
dynamic = ["version"]
dependencies = [
    "salt>=3006",
    "saltext.uci>=0.1.0",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/cprima-homelab/saltext-uci"
Documentation = "https://cprima-homelab.github.io/saltext-uci"
Source = "https://github.com/cprima-homelab/saltext-uci"
Tracker = "https://github.com/cprima-homelab/saltext-uci/issues"

[project.optional-dependencies]
changelog = ["towncrier==25.8.0"]
dev = [
    "nox[uv]>=2024.3,!=2025.05.01",
    "pre-commit>=2.21.0",
    "ruff>=0.4",
]
# These dependencies are used in automations. It can be helpful
# to have them installed in the dev venv, e.g. for editor integration.
# When initializing the dev env using the included automation, pass
# `--extras` to install them automatically.
dev_extra = [
    "ruff>=0.4",
    "coverage==7.13.4",
]
docs = [
  "sphinx",
  "sphinx-prompt",
  "sphinxcontrib-spelling",
  "sphinx-copybutton",
  "towncrier==25.8.0",
  "sphinxcontrib-towncrier",
  "myst_parser",
  "furo",
  "sphinx-inline-tabs",
  "sphinxcontrib-mermaid",
]
docsauto = ["sphinx-autobuild"]
lint = [
    "pylint>=4.0.4",
]
tests = [
    "pytest>=7.2.0",
    "pytest-salt-factories>=1.0.0",
    "pytest-instafail",
    "paramiko>=5.0.0",
    "python-dotenv>=1.2.2",
]

[project.entry-points."salt.loader"]
"saltext.uci-ubus" = "saltext.uci_ubus"

[dependency-groups]
dev = [
    "paramiko>=5.0.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.4",
]

[tool.uv]
# Salt's legacy setup.py requires old setuptools.
# Since uv 0.6.0, it does not fall back to reading requirements from egg-info.
build-constraint-dependencies = ["setuptools<69"]

[tool.uv.sources]
# saltext.uci isn't published under this name yet -- resolve from the
# sibling package directory until the split is released.
"saltext.uci" = { path = "../uci", editable = true }

[tool.setuptools]
zip-safe = false
include-package-data = true
platforms = ["any"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests"]

[tool.distutils.bdist_wheel]
# Use this option if your package is pure-python
universal = 1

[tool.distutils.sdist]
owner = "root"
group = "root"

[tool.build_sphinx]
source_dir = "docs"
build_dir = "build/sphinx"

[tool.towncrier]
package = "saltext.uci_ubus"
filename = "CHANGELOG.md"
template = "changelog/.template.jinja"
directory = "changelog/"
start_string = "# Changelog\n"
underlines = ["", "", ""]
title_format = "## {version} ({project_date})"
issue_format = "[#{issue}](https://github.com/cprima-homelab/saltext-uci/issues/{issue})"

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true
